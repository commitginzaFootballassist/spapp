<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>ASSIST FAMMILY</title>
  
  <script>
    window.onerror = function(msg, url, line) {
        alert("エラーが発生しました: " + msg + "\n行: " + line);
    };
  </script>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root{
      --radius: 22px;
      --shadow: 0 16px 40px rgba(0,0,0,.10);
      --border: rgba(255,255,255,.28);
    }

    body {
      font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
      margin: 0;
      padding: 0; 
      background: #f6f7fb;
    }

    .wrap { max-width: 520px; margin: 0 auto; padding: 24px; }

    /* ===== Member Card ===== */
    .member-card {
      position: relative;
      border-radius: var(--radius);
      padding: 18px 18px 16px 18px;
      color: #fff;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
      min-height: 220px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
    }

    .member-card::before{ content:""; position:absolute; inset:-40% -40% auto auto; width: 260px; height: 260px; transform: rotate(18deg); background: rgba(255,255,255,.18); border-radius: 999px; pointer-events: none; }
    .member-card::after{ content:""; position:absolute; inset:0; background: linear-gradient(135deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 55%), repeating-linear-gradient(135deg, rgba(255,255,255,.10) 0 2px, rgba(255,255,255,0) 2px 10px); opacity:.22; pointer-events:none; mix-blend-mode: soft-light; }

    .top { display:flex; align-items:flex-start; justify-content: space-between; position: relative; z-index: 1; }
    .name { font-weight: 800; letter-spacing: .02em; font-size: 18px; line-height: 1.2; text-shadow: 0 2px 12px rgba(0,0,0,.18); word-break: break-word; }
    .sub { font-size: 12px; opacity: .92; margin-top: 6px; }
    .center {
      display:flex;
      flex-direction: column;
      align-items:center;
      justify-content:center;
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .rank-badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 6px 14px; border-radius: 999px; background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.26); backdrop-filter: blur(6px);
      font-weight: 900; letter-spacing: .08em; font-size: 20px; line-height: 1;
      text-shadow: 0 2px 18px rgba(0,0,0,.20);
    }
    .bottom { display:flex; align-items:flex-end; justify-content: space-between; position: relative; z-index: 1; gap: 10px; }
    .card-right-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      min-width: 0;
    }
    .cashout-days {
      display: none;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(0,0,0,.20);
      border: 1px solid rgba(255,255,255,.24);
      color: rgba(255,255,255,.96);
      font-size: 10px;
      font-weight: 800;
      line-height: 1.25;
      text-align: right;
      white-space: nowrap;
      backdrop-filter: blur(5px);
      text-shadow: 0 1px 8px rgba(0,0,0,.20);
    }
    .points { font-weight: 900; font-size: 36px; letter-spacing: .02em; text-shadow: 0 2px 12px rgba(0,0,0,.18); white-space: nowrap; }
    .points small { font-size: 13px; opacity: .85; margin-left: 6px; font-weight: 700; letter-spacing: .1em; }
    .bonus-points {
      display: none;
      margin-top: 4px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .04em;
      opacity: .92;
      text-shadow: 0 2px 10px rgba(0,0,0,.18);
      white-space: nowrap;
    }
    .bonus-points sup {
      font-size: 10px;
      margin-left: 3px;
    }
    .point-note {
      display: none;
      margin: 8px 4px 0;
      color: #555;
      font-size: 11px;
      line-height: 1.6;
    }
    .point-note .note-mark {
      font-weight: 900;
      color: #333;
    }

    /* ===== Point Breakdown ===== */
    .point-breakdown-section {
      display: none;
      margin-top: 16px;
    }

    .point-breakdown-panel {
      background: #fff;
      border: 1px solid #e9e9ef;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 24px rgba(0,0,0,.06);
    }

    .point-breakdown-more-wrap {
      display: none;
      margin-top: 8px;
    }

    .point-breakdown-more-btn {
      width: 100%;
      appearance: none;
      border: 1px solid #e9e9ef;
      border-radius: 14px;
      background: #fff;
      padding: 12px 14px;
      color: #333;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,.05);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .point-breakdown-more-btn:active {
      transform: translateY(1px);
    }

    .point-breakdown-more-chevron {
      display: inline-block;
      font-size: 16px;
      line-height: 1;
      transition: transform .2s ease;
    }

    .point-breakdown-more-btn[aria-expanded="true"] .point-breakdown-more-chevron {
      transform: rotate(180deg);
    }

    .point-breakdown-older[hidden] {
      display: none;
    }

    .point-breakdown-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .point-breakdown-table th {
      padding: 11px 14px;
      background: #f7f7fa;
      color: #666;
      font-size: 12px;
      font-weight: 900;
      text-align: left;
      border-bottom: 1px solid #e9e9ef;
    }

    .point-breakdown-table th:last-child {
      text-align: right;
    }

    .point-breakdown-table td {
      padding: 13px 14px;
      border-bottom: 1px solid #eeeef3;
      vertical-align: top;
    }

    .point-breakdown-table tbody tr:last-child td {
      border-bottom: none;
    }

    .point-breakdown-month {
      width: 52%;
      color: #222;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
      vertical-align: middle !important;
    }

    .point-breakdown-values {
      width: 48%;
      text-align: right;
      white-space: nowrap;
    }

    .point-change {
      font-size: 14px;
      font-weight: 900;
      line-height: 1.6;
      white-space: nowrap;
    }

    .point-change.plus { color: #16a34a; }
    .point-change.minus { color: #dc2626; }
    .point-change.zero { color: #6b7280; }

    /* ===== Notice / Other UI ===== */
    .notice-section{ margin-top: 16px; }
    .section-head{ display:flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 2px 10px 2px; }
    .section-title{ margin: 0; font-size: 16px; font-weight: 900; color:#111; }
    .notice-wrap{ display: grid; gap: 10px; }
    .notice-panel{ background: #fff; border: 1px solid #e9e9ef; border-radius: 16px; padding: 14px; box-shadow: 0 10px 24px rgba(0,0,0,.06); overflow: hidden; }
    .notice-head{ display:grid; grid-template-columns: 1fr; gap: 8px; }
    .notice-title{ font-weight: 900; font-size: 16px; margin: 0; color:#111; line-height: 1.25; }
    .notice-meta{ font-size: 12px; color:#666; }
    .notice-body{ margin-top: 10px; color:#222; font-size: 14px; line-height: 1.7; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .notice-panel.is-clickable{ cursor:pointer; }
    .notice-panel.is-clickable:active{ transform: translateY(1px); }
    .notice-hint{ margin-top: 10px; font-size: 12px; color:#777; font-weight: 700; }
    .notice-link{ display:inline-block; margin-top:12px; color:#111; font-size:13px; font-weight:800; text-decoration: underline; }

    /* ===== Calendar ===== */
    .calendar-section{ margin-top: 16px; }
    .calendar-nav{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin: 0 0 10px; background:#fff; border:1px solid #e9e9ef; border-radius:16px; padding:10px 12px; box-shadow:0 10px 24px rgba(0,0,0,.06); }
    .calendar-range{ color:#111; font-size: 15px; font-weight:900; text-align:center; flex:1; white-space: nowrap; }
    .calendar-nav-btn{ appearance:none; border:none; background:#111; color:#fff; width:38px; height:34px; border-radius:999px; font-size:18px; font-weight:900; line-height:1; cursor:pointer; }
    .calendar-nav-btn:disabled{ background:#d6d6de; color:#777; cursor:not-allowed; }
    .calendar-nav-btn:not(:disabled):active{ transform: translateY(1px); opacity:.82; }
    .calendar-wrap{ display:grid; gap: 10px; }
    .calendar-month{ background:#fff; border:1px solid #e9e9ef; border-radius:16px; padding:14px; box-shadow:0 10px 24px rgba(0,0,0,.06); }
    .calendar-grid{ display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; }
    .calendar-dow{ text-align:center; font-size:11px; color:#777; font-weight:800; padding:3px 0; }
    .calendar-day{ min-height:62px; border-radius:10px; background:#f7f7fa; padding:5px 4px; box-sizing:border-box; overflow:hidden; border:1px solid transparent; }
    .calendar-day.empty{ background:transparent; border-color:transparent; }
    .calendar-day.today{ outline:2px solid #111; background:#fff; }
    .calendar-day.has-events{ background:#fff; border-color:#e4e4ec; cursor:pointer; }
    .calendar-day.has-events:active{ transform: translateY(1px); background:#f4f4f8; }
    .calendar-date{ font-size:11px; font-weight:900; color:#222; line-height:1; }
    .calendar-event{ margin-top:4px; padding:3px 4px; border-radius:7px; background:var(--event-color, #111); color:var(--event-text-color, #fff); font-size:10px; font-weight:800; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; }
    .calendar-more{ margin-top:3px; font-size:10px; color:#666; line-height:1; font-weight:800; }
    .calendar-empty-text{ color:#777; font-size:12px; padding:8px 2px 0; }
    .day-event-list{ display:grid; gap:10px; margin-top:4px; }
    .day-event-item{ width:100%; appearance:none; border:1px solid #e7e7ef; background:#fff; border-radius:14px; padding:12px; text-align:left; cursor:pointer; box-shadow:0 8px 18px rgba(0,0,0,.05); }
    .day-event-item:active{ transform: translateY(1px); background:#f7f7fa; }
    .day-event-title-row{ display:flex; align-items:center; gap:8px; }
    .day-event-color{ width:12px; height:12px; border-radius:999px; flex:0 0 auto; background:var(--event-color, #111); border:1px solid rgba(0,0,0,.08); }
    .day-event-title{ color:#111; font-size:14px; font-weight:900; line-height:1.35; }
    .day-event-meta{ margin-top:6px; color:#666; font-size:12px; line-height:1.5; }
    .day-event-label{ display:inline-flex; align-items:center; margin-top:8px; padding:3px 8px; border-radius:999px; background:var(--event-color, #111); color:var(--event-text-color, #fff); font-size:11px; font-weight:900; line-height:1.2; }

    /* ===== Common modal for notice/calendar ===== */
    .app-modal{ position:fixed; inset:0; z-index:1500; display:flex; align-items:center; justify-content:center; padding:20px; box-sizing:border-box; opacity:0; visibility:hidden; transition:.2s; }
    .app-modal.show{ opacity:1; visibility:visible; }
    .app-modal-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.55); }
    .app-modal-panel{ position:relative; width:100%; max-width:460px; max-height:82vh; overflow:auto; background:#fff; border-radius:18px; padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.24); box-sizing:border-box; }
    .app-modal-close{ position:absolute; top:10px; right:10px; width:34px; height:34px; border:none; border-radius:999px; background:#f1f1f5; color:#111; font-size:20px; font-weight:900; cursor:pointer; }
    .app-modal-meta{ padding-right:42px; color:#777; font-size:12px; line-height:1.6; white-space:pre-wrap; }
    .app-modal-title{ margin:8px 42px 12px 0; color:#111; font-size:18px; line-height:1.35; font-weight:900; }
    .app-modal-body{ color:#222; font-size:14px; line-height:1.8; white-space:pre-wrap; word-break:break-word; }
    
    .panel { background: #fff; border: 1px solid #e9e9ef; border-radius: 16px; padding: 24px; box-shadow: 0 10px 24px rgba(0,0,0,.06); }
    label { font-size: 13px; color:#333; display:block; margin-bottom: 8px; font-weight: bold; }
    input { width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 10px; border: 1px solid #d9d9e3; outline: none; font-size: 16px; background: #fdfdfd; transition: border-color 0.2s; }
    input:focus { border-color: #111; }
    
    .btn-primary {
      width: 100%; padding: 16px; border-radius: 12px; border: none; cursor: pointer;
      background: #111; color: #fff; font-weight: 800; font-size: 16px; margin-top: 20px;
      transition: background 0.3s;
    }
    .btn-primary:disabled{ opacity:.6; cursor: not-allowed; }

    /* ガチャ起動ボタン */
    .btn-gacha {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
      margin-top: 20px;
    }
    .btn-gacha:disabled {
      background: #9ca3af;
      box-shadow: none;
      color: #f3f4f6;
    }

    .muted { color:#666; font-size: 12px; }
    .error { color:#b00020; font-size: 13px; margin-top: 12px; text-align: center; }

    /* ===== Rank Colors ===== */
    .rank-a4 { background: linear-gradient(135deg, #4d2c00 0%, #7a5230 45%, #a67c52 50%, #7a5230 55%, #4d2c00 100%); }
    .rank-a3 { background: linear-gradient(135deg, #757575 0%, #9e9e9e 45%, #e8e8e8 50%, #9e9e9e 55%, #757575 100%); }
    .rank-a2 { background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 45%, #b38728 50%, #fcf6ba 55%, #aa771c 100%); color: #5d4037 !important; }
    .rank-a2 .rank-badge { color: #5d4037; border-color: rgba(93,64,55,0.2); }
    .rank-a2 .sub, .rank-a2 .muted { color: rgba(93,64,55,0.8) !important; }
    .rank-a1 { background: linear-gradient(135deg, #434343 0%, #000000 45%, #2c3e50 50%, #000000 55%, #434343 100%); }

    /* Loader */
    #loadingView { padding: 40px 6px; text-align: center; }
    .loader { width: 32px; height: 32px; border: 3px solid rgba(0,0,0,.1); border-top-color: #111; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* 修正箇所: loadingViewは最初から表示させる */
    #registerView, #memberView, #errorView, #gachaView { display:none; }

    /* ==========================================
       ガチャ用スタイル (全画面)
    ========================================== */
    #gachaView {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #000 url('./fair_play_bg.jpg') no-repeat center bottom / cover;
        z-index: 1000; flex-direction: column; align-items: center; overflow: hidden;
    }
    .gacha-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 0; }
    .gacha-header { position: relative; z-index: 10; width: 100%; display: flex; justify-content: flex-end; padding: 15px; box-sizing: border-box; }
    .gacha-close { background: rgba(0,0,0,0.6); color: white; border: 1px solid rgba(255,255,255,0.5); padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .pk-area { position: relative; z-index: 5; flex-grow: 1; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 30px; }
    .goal {
        position: absolute; bottom: 31%; width: 80%; max-width: 340px; height: 120px;
        border: 4px solid #fff; border-bottom: none;
        background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.3) 10px, rgba(255,255,255,0.3) 12px),
                    repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(255,255,255,0.3) 10px, rgba(255,255,255,0.3) 12px);
        z-index: 1; transition: transform 0.1s;
    }
    .ball {
        position: absolute; bottom: 7%; width: 180px; height: 180px;
        background: url('./ball.png') no-repeat center / contain;
        filter: drop-shadow(0 10px 5px rgba(0,0,0,0.6)); z-index: 10;
        animation: float 2s infinite ease-in-out;
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes chargeRumble { 0% { transform: translate(2px, 1px) rotate(0deg); } 25% { transform: translate(-2px, -1px) rotate(-1deg); } 50% { transform: translate(0px, 2px) rotate(1deg); } 75% { transform: translate(-1px, -2px) rotate(0deg); } 100% { transform: translate(1px, 0px) rotate(-1deg); } }
    .ball.charging { animation: chargeRumble 0.1s infinite; filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.9)); }
    .ball.shoot-win { animation: none; transform: translate(0, -10vh) scale(0.2) rotate(1080deg); transition: transform 2s cubic-bezier(0.1, 0.7, 0.3, 1); }
    .ball.shoot-lose { animation: none; transform: translate(-38vw, -25vh) scale(0.25) rotate(720deg); transition: transform 2s cubic-bezier(0.1, 0.7, 0.3, 1); }
    .ball.shoot-lose-drop { transform: translate(-38vw, -10vh) scale(0.25) rotate(180deg); transition: transform 0.8s cubic-bezier(0.5, 0, 1, 1); }
    .goal.shake { animation: netShake 0.4s ease-in-out; }
    @keyframes netShake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px) scaleY(1.02); } 75% { transform: translateX(5px) scaleY(0.98); } }

    .shoot-btn {
        position: relative; z-index: 20; background: linear-gradient(to bottom, #ef4444, #dc2626); color: white; border: 2px solid #b91c1c;
        padding: 15px 0; width: 80%; max-width: 300px; font-size: 20px; font-weight: bold; border-radius: 30px;
        box-shadow: 0 6px 0 #991b1b, 0 10px 20px rgba(0,0,0,0.5); margin-bottom: 40px; cursor: pointer; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }
    .shoot-btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0 0 #991b1b, 0 4px 10px rgba(0,0,0,0.5); }
    .shoot-btn:disabled { background: #6b7280; border-color: #4b5563; box-shadow: 0 6px 0 #374151; cursor: not-allowed; }

    .gacha-modal {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85);
        display: flex; justify-content: center; align-items: center;
        opacity: 0; visibility: hidden; transition: 0.3s; z-index: 100;
    }
    .gacha-modal.show { opacity: 1; visibility: visible; }
    .gacha-modal-content { background: #fff; padding: 30px; border-radius: 15px; text-align: center; width: 80%; max-width: 320px; transform: scale(0.8); transition: 0.3s; }
    .gacha-modal.show .gacha-modal-content { transform: scale(1); }
    .result-text { font-size: 32px; font-weight: bold; margin-bottom: 10px; }
    .win-text { color: #dc2626; } .lose-text { color: #4b5563; }
    .point-text { font-size: 24px; color: #d97706; font-weight: bold; margin-bottom: 20px; }


    /* ===== Gacha step status ===== */
    .gacha-status {
        position: relative;
        z-index: 20;
        width: calc(100% - 40px);
        max-width: 360px;
        margin: 4px auto 0;
        padding: 14px 16px;
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.28);
        color: #fff;
        text-align: center;
        box-sizing: border-box;
        backdrop-filter: blur(6px);
        box-shadow: 0 10px 30px rgba(0,0,0,.28);
    }
    .gacha-status-step {
        font-size: 12px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: .14em;
        color: #fde68a;
        margin-bottom: 7px;
    }
    .gacha-status-main {
        font-size: 19px;
        font-weight: 900;
        line-height: 1.35;
        text-shadow: 0 2px 12px rgba(0,0,0,.45);
    }
    .gacha-status-sub {
        margin-top: 7px;
        font-size: 12px;
        line-height: 1.6;
        color: rgba(255,255,255,.88);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loadingView">
      <div class="loader"></div>
      <div class="muted">読み込み中…</div>
    </div>

    <div id="memberView">
      <div id="card" class="member-card rank-a4">
        <div class="top">
          <div>
            <div class="name" id="name">-</div>
            <div class="sub muted" style="color:rgba(255,255,255,.92)">Assist Family</div>
          </div>
        </div>
        <div class="center">
          <div class="points" id="points">0 <small>POINTS</small></div>
          <div class="bonus-points" id="entryBonusPoints">150,000 P <sup>*1</sup></div>
        </div>
        <div class="bottom">
          <div class="rank-badge" id="rankBadge">A4</div>
          <div class="card-right-meta">
            <div class="cashout-days" id="cashoutDays"></div>
            <div class="muted" style="color:rgba(255,255,255,.92); white-space:nowrap;">Football Assist</div>
          </div>
        </div>
      </div>

      <div class="point-note" id="entryBonusNote">
        <span class="note-mark">*1</span>
        入社月より3ヶ月間有効です。
      </div>
      
      <div id="pointBreakdownSection" class="point-breakdown-section">
        <div class="section-head">
          <h3 class="section-title">ポイント内訳</h3>
        </div>

        <div id="pointBreakdownPanel" class="point-breakdown-panel">
          <div id="pointBreakdownView"></div>
        </div>

        <div id="pointBreakdownMoreWrap" class="point-breakdown-more-wrap">
          <button
            id="pointBreakdownMoreBtn"
            class="point-breakdown-more-btn"
            type="button"
            aria-expanded="false"
            aria-controls="pointBreakdownOlder"
          >

<script>
const LIFF_ID = '2009200776-bffw4Fd6';
const API_URL = 'https://vqzc369jaa.execute-api.ap-northeast-1.amazonaws.com/member';
let currentMember = null;

function showOnly(viewId) {
  const ids = ['loadingView', 'memberView', 'registerView', 'errorView', 'gachaView'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) {
        if(id === viewId) {
            el.style.display = (id === 'gachaView') ? 'flex' : 'block';
        } else {
            el.style.display = 'none';
        }
    }
  });
}

async function post(action, payload = {}, retries = 1) {
  try {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), 10000);
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, ...payload }),
      signal: controller.signal
    });
    clearTimeout(id);

    let data = {};
    try {
      data = await res.json();
    } catch (_) {
      data = {};
    }

    // Lambdaが { ok:false, error:"..." } を返した場合、画面側で内容を見て分岐できるようにする。
    if (!res.ok) {
      if (data && data.ok === false) return data;
      throw new Error(`サーバーエラー: ${res.status}`);
    }

    return data;
  } catch (err) {
    if (retries > 0 && (err.name === 'AbortError' || err.message === 'Failed to fetch')) {
      return post(action, payload, retries - 1);
    }
    throw err;
  }
}

function normalizeRank(rank) { return ['A1','A2','A3','A4'].includes((rank || '').toString().trim().toUpperCase()) ? (rank || '').toString().trim().toUpperCase() : 'A4'; }
function rankClass(rank) { switch (rank) { case 'A1': return 'rank-a1'; case 'A2': return 'rank-a2'; case 'A3': return 'rank-a3'; default: return 'rank-a4'; } }

const ENTRY_BONUS_START_YEAR = 2026;
const ENTRY_BONUS_START_MONTH = 6;
const ENTRY_BONUS_MONTHS = 3;
const ENTRY_BONUS_DEFAULT_POINTS = 150000;

function monthIndex(year, month) {
  return year * 12 + (month - 1);
}

function getTokyoYearMonth() {
  const parts = new Intl.DateTimeFormat('ja-JP-u-ca-gregory', {
    timeZone: 'Asia/Tokyo',
    year: 'numeric',
    month: 'numeric'
  }).formatToParts(new Date());

  return {
    year: Number(parts.find(p => p.type === 'year')?.value),
    month: Number(parts.find(p => p.type === 'month')?.value)
  };
}

function parseJoinMonth(value) {
  const s = String(value ?? '').trim();
  if (!s) return null;

  // 対応例: 2026/06/01, 2026-06, 2026年6月, 202606
  const m = s.match(/(\d{4})\D{0,3}(\d{1,2})/);
  if (!m) return null;

  const year = Number(m[1]);
  const month = Number(m[2]);
  if (!Number.isFinite(year) || !Number.isFinite(month)) return null;
  if (month < 1 || month > 12) return null;

  return { year, month };
}

function shouldShowEntryBonusByJoinMonth(joinMonthValue) {
  const joined = parseJoinMonth(joinMonthValue);
  if (!joined) return false;

  const joinIdx = monthIndex(joined.year, joined.month);
  const startIdx = monthIndex(ENTRY_BONUS_START_YEAR, ENTRY_BONUS_START_MONTH);
  if (joinIdx < startIdx) return false;

  const now = getTokyoYearMonth();
  if (!Number.isFinite(now.year) || !Number.isFinite(now.month)) return false;

  const nowIdx = monthIndex(now.year, now.month);
  return nowIdx >= joinIdx && nowIdx <= joinIdx + (ENTRY_BONUS_MONTHS - 1);
}

function toggleEntryBonus(member) {
  const bonusPoints = document.getElementById('entryBonusPoints');
  const bonusNote = document.getElementById('entryBonusNote');
  if (!bonusPoints || !bonusNote) return;

  // LambdaがshowEntryBonusを返す場合はそれを優先。未対応時だけフロント側で月単位判定。
  const show = typeof member?.showEntryBonus === 'boolean'
    ? member.showEntryBonus
    : shouldShowEntryBonusByJoinMonth(member?.joinMonth);

  const bonusPointValue = Number.isFinite(Number(member?.entryBonusPoints))
    ? Number(member.entryBonusPoints)
    : ENTRY_BONUS_DEFAULT_POINTS;

  bonusPoints.innerHTML = `${bonusPointValue.toLocaleString()} P <sup>*1</sup>`;
  bonusPoints.style.display = show ? 'block' : 'none';
  bonusNote.style.display = show ? 'block' : 'none';
}

const RANK_INCENTIVE_POINTS = {
  A4: 10000,
  A3: 30000,
  A2: 50000,
  A1: 100000
};

function getRankIncentivePoints(rank) {
  const normalized = normalizeRank(rank);
  return RANK_INCENTIVE_POINTS[normalized] ?? RANK_INCENTIVE_POINTS.A4;
}

function parsePointBreakdownRaw(rawValue) {
  const raw = String(rawValue ?? '').trim();
  if (!raw) return [];

  const pattern = /(\d{4})\s*年\s*(\d{1,2})\s*月\s*:\s*([+-]?\s*[\d,]+(?:\.\d+)?)\s*pt/gi;
  const grouped = new Map();

  let match;
  while ((match = pattern.exec(raw)) !== null) {
    const year = Number(match[1]);
    const month = Number(match[2]);
    if (!Number.isFinite(year) || !Number.isFinite(month) || month < 1 || month > 12) continue;

    const point = Number(String(match[3]).replace(/\s/g, '').replace(/,/g, ''));
    if (!Number.isFinite(point)) continue;

    const monthLabel = `${year}年${String(month).padStart(2, '0')}月`;

    if (!grouped.has(monthLabel)) {
      grouped.set(monthLabel, { month: monthLabel, items: [] });
    }

    grouped.get(monthLabel).items.push({ point });
  }

  return Array.from(grouped.values());
}

function applyRankIncentiveToBreakdown(groups, rank) {
  const rankBonus = getRankIncentivePoints(rank);

  return (Array.isArray(groups) ? groups : [])
    .filter(group => group && group.month && Array.isArray(group.items) && group.items.length > 0)
    .map(group => {
      // 1段目は勤怠ポイント
      const attendancePoint = Number(group.items[0]?.point);
      const safeAttendancePoint = Number.isFinite(attendancePoint) ? attendancePoint : 0;

      // 2段目以降はインセンティブ元値として合算。
      // 通常は2レコード目のみ。
      const incentiveBase = group.items.slice(1).reduce((sum, item) => {
        const value = Number(item?.point);
        return sum + (Number.isFinite(value) ? value : 0);
      }, 0);

      return {
        month: group.month,
        rank: normalizeRank(rank),
        rankBonus,
        items: [
          {
            type: 'attendance',
            point: safeAttendancePoint,
            basePoint: safeAttendancePoint,
            rankBonus: 0
          },
          {
            type: 'incentive',
            point: incentiveBase + rankBonus,
            basePoint: incentiveBase,
            rankBonus,
            synthesized: group.items.length < 2
          }
        ]
      };
    });
}

function normalizePointBreakdown(member) {
  // Lambda v3以降はすでにランク加算済み・2段構成なのでそのまま使う。
  if (Array.isArray(member?.pointBreakdown) && member.pointBreakdown.length > 0) {
    const isAdjusted = member.pointBreakdown.every(group =>
      Array.isArray(group?.items)
      && group.items.length >= 2
      && group.items[0]?.type === 'attendance'
      && group.items[1]?.type === 'incentive'
    );
    if (isAdjusted) return member.pointBreakdown;

    // 旧LambdaのpointBreakdownが返ってきた場合もフロントで補正。
    return applyRankIncentiveToBreakdown(member.pointBreakdown, member?.rank);
  }

  // rawしかない場合のフォールバック。
  return applyRankIncentiveToBreakdown(
    parsePointBreakdownRaw(member?.pointBreakdownRaw),
    member?.rank
  );
}

function pointBreakdownMonthSortValue(monthLabel) {
  const m = String(monthLabel || '').match(/(\d{4})\D{0,3}(\d{1,2})/);
  if (!m) return -1;

  const year = Number(m[1]);
  const month = Number(m[2]);

  if (!Number.isFinite(year) || !Number.isFinite(month) || month < 1 || month > 12) {
    return -1;
  }

  return year * 100 + month;
}

function sortPointBreakdownDescending(groups) {
  return [...(Array.isArray(groups) ? groups : [])].sort((a, b) => {
    return pointBreakdownMonthSortValue(b?.month) - pointBreakdownMonthSortValue(a?.month);
  });
}

function setOlderPointBreakdownExpanded(expanded) {
  const older = document.getElementById('pointBreakdownOlder');
  const btn = document.getElementById('pointBreakdownMoreBtn');
  const textEl = document.getElementById('pointBreakdownMoreText');

  if (!older || !btn) return;

  const isExpanded = expanded === true;
  older.hidden = !isExpanded;
  btn.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');

  if (textEl) {
    textEl.textContent = isExpanded
      ? '過去のポイント内訳を閉じる'
      : '過去のポイント内訳を表示';
  }
}

function toggleOlderPointBreakdown() {
  const btn = document.getElementById('pointBreakdownMoreBtn');
  if (!btn) return;

  const isExpanded = btn.getAttribute('aria-expanded') === 'true';
  setOlderPointBreakdownExpanded(!isExpanded);
}

document.getElementById('pointBreakdownMoreBtn')?.addEventListener('click', toggleOlderPointBreakdown);

function renderPointBreakdown(member) {
  const section = document.getElementById('pointBreakdownSection');
  const view = document.getElementById('pointBreakdownView');
  const moreWrap = document.getElementById('pointBreakdownMoreWrap');

  if (!section || !view) return;

  const groups = sortPointBreakdownDescending(
    normalizePointBreakdown(member)
      .filter(group => group && group.month && Array.isArray(group.items) && group.items.length > 0)
  );

  view.innerHTML = '';

  if (moreWrap) {
    moreWrap.style.display = 'none';
  }

  if (groups.length === 0) {
    section.style.display = 'none';
    return;
  }

  const latestGroups = groups.slice(0, 3);
  const olderGroups = groups.slice(3);

  const table = document.createElement('table');
  table.className = 'point-breakdown-table';

  const thead = document.createElement('thead');
  const headRow = document.createElement('tr');

  const monthHead = document.createElement('th');
  monthHead.textContent = '月';

  const pointHead = document.createElement('th');
  pointHead.textContent = 'ポイント';
  pointHead.style.textAlign = 'right';

  headRow.appendChild(monthHead);
  headRow.appendChild(pointHead);
  thead.appendChild(headRow);
  table.appendChild(thead);

  function appendGroupsToTbody(targetTbody, targetGroups) {
    targetGroups.forEach(group => {
      const items = group.items.slice(0, 2);

      items.forEach((item, index) => {
        const point = Number(item?.point);
        if (!Number.isFinite(point)) return;

        const tr = document.createElement('tr');

        if (index === 0) {
          const monthTd = document.createElement('td');
          monthTd.className = 'point-breakdown-month';
          monthTd.rowSpan = items.length;
          monthTd.textContent = String(group.month || '');
          tr.appendChild(monthTd);
        }

        const pointTd = document.createElement('td');
        pointTd.className = 'point-breakdown-values';

        const pointEl = document.createElement('div');
        const signClass = point > 0 ? 'plus' : point < 0 ? 'minus' : 'zero';
        pointEl.className = `point-change ${signClass}`;
        pointEl.textContent = point > 0
          ? `+${point.toLocaleString()} pt`
          : `${point.toLocaleString()} pt`;

        pointTd.appendChild(pointEl);
        tr.appendChild(pointTd);
        targetTbody.appendChild(tr);
      });
    });
  }

  // 最新3か月分は常時表示
  const latestTbody = document.createElement('tbody');
  latestTbody.id = 'pointBreakdownLatest';
  appendGroupsToTbody(latestTbody, latestGroups);
  table.appendChild(latestTbody);

  // 4か月目以降は初期状態で非表示
  if (olderGroups.length > 0) {
    const olderTbody = document.createElement('tbody');
    olderTbody.id = 'pointBreakdownOlder';
    olderTbody.className = 'point-breakdown-older';
    olderTbody.hidden = true;

    appendGroupsToTbody(olderTbody, olderGroups);
    table.appendChild(olderTbody);

    if (moreWrap) {
      moreWrap.style.display = 'block';
    }
  }

  view.appendChild(table);
  section.style.display = 'block';

  // 再描画時も必ず4か月目以降は閉じた状態に戻す
  if (olderGroups.length > 0) {
    setOlderPointBreakdownExpanded(false);
  }
}

function renderCashoutDays(member) {
  const el = document.getElementById('cashoutDays');
  if (!el) return;

  const raw = member?.pointCashoutRemainingDays;

  if (raw === null || raw === undefined || String(raw).trim() === '') {
    el.textContent = '';
    el.style.display = 'none';
    return;
  }

  const days = Number(raw);
  if (!Number.isFinite(days)) {
    el.textContent = '';
    el.style.display = 'none';
    return;
  }

  const safeDays = Math.max(0, Math.trunc(days));
  el.textContent = `ポイント交換可能日まで あと${safeDays.toLocaleString()}日（予定）`;
  el.style.display = 'block';
}

function renderCard(member) {
  currentMember = member || null;

  const fullName = `${(member?.lastName || '').trim()} ${(member?.firstName || '').trim()}`.trim() || '-';
  const pointNum = Number.isFinite(Number(member?.point ?? 0)) ? Number(member?.point ?? 0) : 0;
  const rank = normalizeRank(member?.rank);
  const card = document.getElementById('card');
  card.classList.remove('rank-a1','rank-a2','rank-a3','rank-a4'); card.classList.add(rankClass(rank));
  document.getElementById('name').textContent = fullName;
  document.getElementById('rankBadge').textContent = rank;
  document.getElementById('points').innerHTML = `${pointNum.toLocaleString()} <small>POINTS</small>`;
  toggleEntryBonus(member);
  renderPointBreakdown(member);
  renderCashoutDays(member);
  
  // ▼ H列、I列、J列の状態に基づくボタン制御
  const gachaBtn = document.getElementById('openGachaBtn');
  const isPointPending = member?.gachaPendingPoint === true
    || member?.isPointPending === true
    || member?.gachaStep === 'point_pending'
    || member?.gachaPhase === 'point_pending';
  
  if (!member?.isEligible) {
      // H列に値がない（対象外）場合は、ボタン自体を完全に隠す
      gachaBtn.style.display = 'none';
  } else {
      // H列に値がある（対象者）場合はボタンを表示
      gachaBtn.style.display = 'block';
      
      if (member?.hasPlayedGacha) {
          // I列に「済」がある（最終結果まで完了）場合
          gachaBtn.disabled = true;
          gachaBtn.innerText = '⚽️ ガチャは挑戦済みです';
      } else if (isPointPending) {
          // ユニフォーム抽選落選後、ポイント抽選待ちの場合
          gachaBtn.disabled = false;
          gachaBtn.innerText = '⚽️ セカンドチャンスに挑戦！';
      } else {
          // 未挑戦の場合
          gachaBtn.disabled = false;
          gachaBtn.innerText = '⚽️ フェアプレー賞 限定PKに挑戦！';
      }
  }
}

function showRegister() { showOnly('registerView'); document.getElementById('regMsg').textContent = ''; document.getElementById('lastName').value = ''; document.getElementById('firstName').value = ''; }
function showError(msg) { showOnly('errorView'); document.getElementById('errMsg').textContent = msg || '不明なエラー'; }
function fmtPeriod(s, e) { if (!s && !e) return ''; if (s && e) return `${s} 〜 ${e}`; if (s) return `${s} 〜`; return `〜 ${e}`; }
function escapeHtml(str) { return String(str ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;'); }
function safeUrl(u) { if (!u) return ''; if (u.startsWith('http://') || u.startsWith('https://')) return u; return ''; }

function showAppModal({ title = '', meta = '', body = '', bodyNode = null, url = '' } = {}) {
  const modal = document.getElementById('appModal');
  const bodyEl = document.getElementById('appModalBody');
  document.getElementById('appModalTitle').textContent = title || '';
  document.getElementById('appModalMeta').textContent = meta || '';

  bodyEl.innerHTML = '';
  if (bodyNode instanceof Node) {
    bodyEl.appendChild(bodyNode);
  } else {
    bodyEl.textContent = body || '';
  }

  const link = document.getElementById('appModalLink');
  const href = safeUrl(url || '');
  if (href) {
    link.href = href;
    link.style.display = 'inline-block';
  } else {
    link.removeAttribute('href');
    link.style.display = 'none';
  }

  modal.classList.add('show');
  modal.setAttribute('aria-hidden', 'false');
}

function closeAppModal() {
  const modal = document.getElementById('appModal');
  if (!modal) return;
  modal.classList.remove('show');
  modal.setAttribute('aria-hidden', 'true');
}

document.addEventListener('keydown', (e) => {

});

function makeClickable(el, handler) {
  el.addEventListener('click', handler);
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      handler();
    }
  });
}

function renderNotices(notices) {
  const section = document.getElementById('noticeSection');
  const wrap = document.getElementById('noticeView');
  wrap.innerHTML = '';

  if (!Array.isArray(notices) || notices.length === 0) {
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';

  notices.slice(0, 3).forEach(n => {
    const period = fmtPeriod(n.startAt, n.endAt);
    const panel = document.createElement('div');
    panel.className = 'notice-panel is-clickable';
    panel.setAttribute('role', 'button');
    panel.tabIndex = 0;
    panel.innerHTML = `
      <div class="notice-head">
        ${period ? `<div class="notice-meta">掲載期間: ${escapeHtml(period)}</div>` : ``}
        <h4 class="notice-title">${escapeHtml(n.title || 'お知らせ')}</h4>
      </div>
      ${n.body ? `<div class="notice-body">${escapeHtml(n.body)}</div>` : ``}
      <div class="notice-hint">タップして全文を見る</div>
    `;

    makeClickable(panel, () => {
      showAppModal({
        title: n.title || 'お知らせ',
        meta: period ? `掲載期間: ${period}` : '',
        body: n.body || '本文はありません。',
        url: n.url || ''
      });
    });

    wrap.appendChild(panel);
  });
}

async function fetchAndRenderNotices(accessToken) {
  try {
    const noticeRes = await post('notices', { accessToken });
    renderNotices(noticeRes?.ok === true ? (noticeRes.notices || []) : []);
  } catch (_) {
    renderNotices([]);
  }
}

const CALENDAR_MONTH_COUNT = 3;
const CALENDAR_COLOR_MAP = {
  'スペリオ': '#8dcdce',
  'レディース': '#fe88d2',
  'イベント': '#ff0000',
  'ご飯会': '#ae0be1'
};
let calendarEventsCache = [];
let calendarMonthOffset = 0;

function pad2(n) { return String(n).padStart(2, '0'); }
function ymd(date) { return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`; }
function monthLabel(date) { return `${date.getFullYear()}年${date.getMonth() + 1}月`; }
function clampCalendarOffset(offset) { return Math.max(0, Math.min(CALENDAR_MONTH_COUNT - 1, offset)); }
function isValidHexColor(value) { return /^#[0-9a-fA-F]{6}$/.test(String(value || '').trim()); }
function getEventColorLabel(event) { return String(event?.colorLabel || event?.colorType || event?.category || '').trim(); }
function getEventColor(event) {
  const direct = String(event?.color || '').trim();
  if (isValidHexColor(direct)) return direct.toLowerCase();
  return CALENDAR_COLOR_MAP[getEventColorLabel(event)] || '#111111';
}
function getTextColorForBg(hex) {
  const c = isValidHexColor(hex) ? hex.replace('#', '') : '111111';
  const r = parseInt(c.slice(0, 2), 16);
  const g = parseInt(c.slice(2, 4), 16);
  const b = parseInt(c.slice(4, 6), 16);
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.62 ? '#111111' : '#ffffff';
}
function eventColorStyle(event) {
  const bg = getEventColor(event);
  const fg = getTextColorForBg(bg);
  return `--event-color:${bg};--event-text-color:${fg};`;
}
function ymdLabel(key) {
  const parts = String(key || '').split('-').map(Number);
  if (parts.length !== 3 || parts.some(n => !Number.isFinite(n))) return key || '';
  const date = new Date(parts[0], parts[1] - 1, parts[2]);
  const weekDays = ['日', '月', '火', '水', '木', '金', '土'];
  return `${parts[0]}年${parts[1]}月${parts[2]}日（${weekDays[date.getDay()]}）`;
}

function parseDateOnly(value) {
  const s = String(value || '').trim();
  const m = s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
  if (!m) return null;
  return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
}

function groupEventsByDate(events) {
  const map = new Map();

  events.forEach((event, index) => {
    const start = parseDateOnly(event.startDate || event.startAt);
    const parsedEnd = parseDateOnly(event.endDate || event.startDate || event.startAt);
    const end = parsedEnd && parsedEnd >= start ? parsedEnd : start;
    if (!start) return;

    const cursor = new Date(start);
    let guard = 0;
    while (cursor <= end && guard < 100) {
      const key = ymd(cursor);
      if (!map.has(key)) map.set(key, []);
      map.get(key).push({ event, index });
      cursor.setDate(cursor.getDate() + 1);
      guard += 1;
    }
  });

  return map;
}

function formatEventPeriod(event) {
  const start = [event.startDate, event.startTime].filter(Boolean).join(' ');
  const end = [event.endDate, event.endTime].filter(Boolean).join(' ');

  if (start && end && start !== end) return `${start} 〜 ${end}`;
  return start || event.startAt || '';
}

function openCalendarEvent(event) {
  const meta = [];
  const period = formatEventPeriod(event);
  if (period) meta.push(`日時: ${period}`);
  if (event.place) meta.push(`場所: ${event.place}`);
  const label = getEventColorLabel(event);
  if (label) meta.push(`区分: ${label}`);

  showAppModal({
    title: event.title || '予定',
    meta: meta.join('\n'),
    body: event.detail || '詳細情報はありません。',
    url: event.url || ''
  });
}

function openCalendarDayList(dayKey, dayEvents) {
  const list = document.createElement('div');
  list.className = 'day-event-list';

  const safeDayEvents = Array.isArray(dayEvents) ? dayEvents : [];

  safeDayEvents.forEach(({ event }) => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'day-event-item';
    item.style.cssText = eventColorStyle(event);

    const row = document.createElement('div');
    row.className = 'day-event-title-row';

    const dot = document.createElement('span');
    dot.className = 'day-event-color';

    const title = document.createElement('span');
    title.className = 'day-event-title';
    title.textContent = event?.title || '予定';

    row.appendChild(dot);
    row.appendChild(title);
    item.appendChild(row);

    const metaTexts = [];
    const period = formatEventPeriod(event);
    if (period) metaTexts.push(period);
    if (event?.place) metaTexts.push(event.place);

    if (metaTexts.length) {
      const meta = document.createElement('div');
      meta.className = 'day-event-meta';
      meta.textContent = metaTexts.join(' / ');
      item.appendChild(meta);
    }

    const label = getEventColorLabel(event);
    if (label) {
      const badge = document.createElement('span');
      badge.className = 'day-event-label';
      badge.textContent = label;
      item.appendChild(badge);
    }

    item.addEventListener('click', () => openCalendarEvent(event));
    list.appendChild(item);
  });

  showAppModal({
    title: `${ymdLabel(dayKey)}の予定`,
    meta: `${safeDayEvents.length}件`,
    bodyNode: list
  });
}

function renderCalendar(events) {
  if (Array.isArray(events)) {
    calendarEventsCache = events;
  }

  const section = document.getElementById('calendarSection');
  const wrap = document.getElementById('calendarView');
  const label = document.getElementById('calendarRangeLabel');
  const prevBtn = document.getElementById('calendarPrevBtn');
  const nextBtn = document.getElementById('calendarNextBtn');
  if (!section || !wrap) return;

  section.style.display = 'block';
  wrap.innerHTML = '';

  const safeEvents = calendarEventsCache;
  const today = new Date();
  calendarMonthOffset = clampCalendarOffset(calendarMonthOffset);

  const monthDate = new Date(today.getFullYear(), today.getMonth() + calendarMonthOffset, 1);
  const year = monthDate.getFullYear();
  const month = monthDate.getMonth();
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const eventsByDate = groupEventsByDate(safeEvents);
  const weekDays = ['日', '月', '火', '水', '木', '金', '土'];
  const cells = [];
  let monthEventCount = 0;

  if (label) label.textContent = monthLabel(monthDate);
  if (prevBtn) prevBtn.disabled = calendarMonthOffset <= 0;
  if (nextBtn) nextBtn.disabled = calendarMonthOffset >= CALENDAR_MONTH_COUNT - 1;

  weekDays.forEach(d => cells.push(`<div class="calendar-dow">${d}</div>`));

  for (let i = 0; i < firstDay.getDay(); i++) {
    cells.push('<div class="calendar-day empty"></div>');
  }

  for (let day = 1; day <= lastDay.getDate(); day++) {
    const current = new Date(year, month, day);
    const key = ymd(current);
    const dayEvents = eventsByDate.get(key) || [];
    monthEventCount += dayEvents.length;
    const isToday = key === ymd(today);
    const hasEvents = dayEvents.length > 0;

    const eventChips = dayEvents.slice(0, 2).map(({ event }) => {
      const time = event.startTime ? `${escapeHtml(event.startTime)} ` : '';
      return `<div class="calendar-event" style="${eventColorStyle(event)}">${time}${escapeHtml(event.title || '予定')}</div>`;
    }).join('');
    const more = dayEvents.length > 2 ? `<div class="calendar-more">+${dayEvents.length - 2}件：タップして一覧</div>` : '';

    cells.push(`
      <div class="calendar-day ${isToday ? 'today' : ''} ${hasEvents ? 'has-events' : ''}"
           ${hasEvents ? `role="button" tabindex="0" data-day-key="${key}" aria-label="${ymdLabel(key)}の予定 ${dayEvents.length}件"` : ''}>
        <div class="calendar-date">${day}</div>
        ${eventChips}${more}
      </div>
    `);
  }

  const monthEl = document.createElement('div');
  monthEl.className = 'calendar-month';
  monthEl.innerHTML = `<div class="calendar-grid">${cells.join('')}</div>`;
  wrap.appendChild(monthEl);

  if (monthEventCount === 0) {
    const empty = document.createElement('div');
    empty.className = 'calendar-empty-text';
    empty.textContent = 'この月の予定はありません。';
    wrap.appendChild(empty);
  }

  wrap.querySelectorAll('.calendar-day.has-events').forEach(el => {
    const open = () => {
      const key = el.dataset.dayKey;
      const dayEvents = eventsByDate.get(key) || [];
      if (dayEvents.length > 0) openCalendarDayList(key, dayEvents);
    };
    makeClickable(el, open);
  });
}

function moveCalendarMonth(diff) {
  const nextOffset = clampCalendarOffset(calendarMonthOffset + diff);
  if (nextOffset === calendarMonthOffset) return;
  calendarMonthOffset = nextOffset;
  renderCalendar();
}

async function fetchAndRenderCalendar(accessToken) {
  try {
    calendarMonthOffset = 0;
    const res = await post('calendar', { accessToken });
    renderCalendar(res?.ok === true ? (res.events || []) : []);
  } catch (e) {
    const section = document.getElementById('calendarSection');
    if (section) section.style.display = 'none';
  }
}

async function init() {
  try {
    showOnly('loadingView');
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    const accessToken = liff.getAccessToken();
    if (!accessToken) { showError("認証情報の取得に失敗しました。"); return; }
    
    const me = await post('me', { accessToken });
    if (me?.error === "invalid_token") { liff.logout(); liff.login(); return; }
    if (!me || me.ok !== true) throw new Error(me?.error || '会員情報の取得に失敗しました');

    const hasName = (me.member?.lastName || '').trim() !== '' && (me.member?.firstName || '').trim() !== '';
    if (me.status === 'new' || !hasName) { showRegister(); return; }

    showOnly('memberView');
    renderCard(me.member);
    await Promise.all([
      fetchAndRenderCalendar(accessToken),
      fetchAndRenderNotices(accessToken)
    ]);
  } catch (e) { 
    console.error(e); 
    showError("通信エラーが発生しました: " + e.message); 
  }
}

document.getElementById('saveBtn').addEventListener('click', async () => {
    try {
        const lastName = document.getElementById('lastName').value.trim();
        const firstName = document.getElementById('firstName').value.trim();
        const regMsg = document.getElementById('regMsg');
        regMsg.textContent = '';
        if (!lastName || !firstName) { regMsg.textContent = '姓・名を入力してください。'; return; }
        const btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = '登録中…';
        const accessToken = liff.getAccessToken();
        const saved = await post('registerName', { accessToken, lastName, firstName });
        if (!saved || saved.ok !== true) { regMsg.textContent = saved?.error ? `登録失敗: ${saved.error}` : '登録に失敗しました。'; btn.disabled = false; btn.textContent = '登録する'; return; }
        let member = saved.member;
        if (!member) { const me = await post('me', { accessToken }); member = me.member; }
        showOnly('memberView'); renderCard(member);
        await Promise.all([
          fetchAndRenderCalendar(accessToken),
          fetchAndRenderNotices(accessToken)
        ]);
    } catch (e) {
        document.getElementById('regMsg').textContent = e?.message || String(e);
    } finally {
        const btn = document.getElementById('saveBtn'); btn.disabled = false; btn.textContent = '登録する';
    }
});

const ball = document.getElementById('ball');
const goal = document.getElementById('goal');
const shootBtn = document.getElementById('shootBtn');
const gachaModal = document.getElementById('gachaModal');
const gachaResult = document.getElementById('gachaResult');
const gachaStatus = document.getElementById('gachaStatus');
const gachaStatusStep = document.getElementById('gachaStatusStep');
const gachaStatusMain = document.getElementById('gachaStatusMain');
const gachaStatusSub = document.getElementById('gachaStatusSub');

let gachaPhase = 'uniform';

function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

function setGachaStatus(step, main, sub = '') {
    if (gachaStatus) gachaStatus.style.display = 'block';
    if (gachaStatusStep) gachaStatusStep.textContent = step;
    if (gachaStatusMain) gachaStatusMain.textContent = main;
    if (gachaStatusSub) gachaStatusSub.innerHTML = sub;
}

function resetBallAnimation() {
    if (!ball) return;
    ball.className = 'ball';
    // 同じアニメーションを連続で発火できるように再描画を挟む
    void ball.offsetWidth;
}

function isCurrentMemberPointPending() {
    return currentMember?.gachaPendingPoint === true
        || currentMember?.isPointPending === true
        || currentMember?.gachaStep === 'point_pending'
        || currentMember?.gachaPhase === 'point_pending';
}

function updateMemberAsPointPending() {
    currentMember = {
        ...(currentMember || {}),
        hasPlayedGacha: false,
        gachaPendingPoint: true,
        isPointPending: true,
        gachaStep: 'point_pending',
        gachaPhase: 'point_pending'
    };

    const gachaBtn = document.getElementById('openGachaBtn');
    if (gachaBtn) {
        gachaBtn.disabled = false;
        gachaBtn.innerText = '⚽️ セカンドチャンスに挑戦！';
    }
}

function updateMemberAsFinished() {
    currentMember = {
        ...(currentMember || {}),
        hasPlayedGacha: true,
        gachaPendingPoint: false,
        isPointPending: false,
        gachaStep: 'finished',
        gachaPhase: 'completed'
    };

    const gachaBtn = document.getElementById('openGachaBtn');
    if (gachaBtn) {
        gachaBtn.disabled = true;
        gachaBtn.innerText = '⚽️ ガチャは挑戦済みです';
    }
}

function openGacha() {
    showOnly('gachaView');
    resetBallAnimation();
    gachaModal.classList.remove('show');
    gachaResult.innerHTML = '';

    if (isCurrentMemberPointPending()) {
        gachaPhase = 'point';
        setGachaStatus(
            'SECOND CHANCE',
            'セカンドチャンスから再開',
            'ユニフォーム抽選は終了済みです。<br>ボタンを押して1,000pt抽選に挑戦してください。'
        );
        shootBtn.disabled = false;
        shootBtn.innerText = 'セカンドチャンスに挑戦！';
        return;
    }

    gachaPhase = 'uniform';
    setGachaStatus(
        '1st CHALLENGE',
        'まずはユニフォーム抽選',
        '当選した場合は、ポイント抽選を行わず終了します。'
    );
    shootBtn.disabled = false;
    shootBtn.innerText = 'ユニフォーム抽選スタート！';
}

function closeGacha() {
    showOnly('memberView');
}

function closeGachaAndReload() {
    closeGacha();
    init(); 
}

function getGachaErrorMessage(error) {
    const errorMessageMap = {
        already_played: 'すでにガチャに挑戦済みです。',
        not_eligible: 'ガチャの対象者ではありません。',
        user_not_found: '会員情報が見つかりませんでした。',
        line_auth_failed: 'LINE認証に失敗しました。',
        uniform_draw_required: '先にユニフォーム抽選を行ってください。',
        uniform_required: '先にユニフォーム抽選を行ってください。',
        need_uniform_first: '先にユニフォーム抽選を行ってください。',
        invalid_gacha_state: 'ガチャ状態に不整合があります。管理者に確認してください。'
    };
    return errorMessageMap[error] || 'ガチャ結果の取得に失敗しました。';
}

function normalizeUniformResult(apiRes) {
    const rawUniformResult = apiRes?.uniformResult || (apiRes?.isUniformWin ? 'win' : 'lose');
    // ユニフォーム枠が埋まっている場合も、画面上は通常の落選として扱う。
    // 「誰かが当選済みだから外れ」と見せず、全員がユニフォーム抽選に挑戦した体験にする。
    const uniformResult = rawUniformResult === 'closed' ? 'lose' : rawUniformResult;

    return {
        prizeType: apiRes?.prizeType || (apiRes?.isUniformWin ? 'uniform' : 'pending_point'),
        uniformResult,
        pointResult: apiRes?.pointResult || 'waiting',
        isUniformWin: apiRes?.isUniformWin === true || apiRes?.prizeType === 'uniform',
        isPointPending: apiRes?.isPointPending === true
            || apiRes?.pointPending === true
            || apiRes?.prizeType === 'pending_point'
            || apiRes?.nextAction === 'point'
            || apiRes?.nextAction === 'playPointGacha'
    };
}

function normalizePointResult(apiRes) {
    const prizeType = apiRes?.prizeType
        || (apiRes?.isPointWin || apiRes?.isWin ? 'point' : 'none');

    return {
        prizeType,
        pointResult: apiRes?.pointResult || (prizeType === 'point' ? 'win' : 'lose'),
        isPointWin: apiRes?.isPointWin === true || apiRes?.isWin === true || prizeType === 'point'
    };
}

async function showUniformWinResult() {
    ball.classList.remove('charging');
    shootBtn.innerText = '結果発表！';
    updateMemberAsFinished();

    setGachaStatus(
        'SPECIAL GOAL',
        'ユニフォーム抽選に当選！',
        'ポイント抽選は行わず、ユニフォーム賞で確定です。'
    );
    ball.classList.add('shoot-win');
    setTimeout(() => { if (goal) goal.classList.add('shake'); }, 1800);
    await wait(2500);

    gachaResult.innerHTML = `
        <div class="result-text win-text">SPECIAL GOAL!!</div>
        <div class="point-text">ユニフォーム当選</div>
        <p style="color: #666; font-size: 14px;">おめでとうございます！<br>ユニフォーム賞に当選しました。</p>
    `;
    gachaModal.classList.add('show');
}

function prepareSecondChance(uniformResult) {
    ball.classList.remove('charging');
    resetBallAnimation();
    updateMemberAsPointPending();
    gachaPhase = 'point';

    if (uniformResult === 'already_lost') {
        setGachaStatus(
            'SECOND CHANCE',
            'セカンドチャンスから再開',
            'ユニフォーム抽選は終了済みです。<br>ボタンを押して、1,000pt抽選に挑戦してください。'
        );
    } else {
        setGachaStatus(
            'SECOND CHANCE',
            'ユニフォーム抽選は惜しくも落選…',
            'まだ終わりではありません。<br>ボタンを押して、セカンドチャンスの1,000pt抽選へ進んでください。'
        );
    }

    shootBtn.disabled = false;
    shootBtn.innerText = 'セカンドチャンスに挑戦！';
}

async function showUniformLoseThenPrepareSecondChance(uniformResult) {
    ball.classList.remove('charging');
    shootBtn.innerText = 'ユニフォーム抽選結果...';

    setGachaStatus(
        'NO GOAL',
        'ユニフォーム抽選は惜しくも落選…',
        'まだセカンドチャンスがあります。<br>このあとボタンを押して、1,000pt抽選に挑戦できます。'
    );

    // ポイント抽選の外れ時と同じく、ゴール外へ外れるアニメーションを必ず実行する。
    ball.classList.add('shoot-lose');
    setTimeout(() => { ball.classList.add('shoot-lose-drop'); }, 2000);
    await wait(3000);

    prepareSecondChance(uniformResult);
}

async function showPointFinalResult(result) {
    ball.classList.remove('charging');
    shootBtn.innerText = '結果発表！';
    updateMemberAsFinished();

    if (result.prizeType === 'point') {
        setGachaStatus(
            'GOAL',
            'ポイント抽選に当選！',
            '1,000pt獲得です。'
        );
        ball.classList.add('shoot-win');
        setTimeout(() => { if (goal) goal.classList.add('shake'); }, 1800);
        await wait(2500);
        gachaResult.innerHTML = `
            <div class="result-text win-text">GOAL!!</div>
            <div class="point-text">1,000 pt 獲得</div>
            <p style="color: #666; font-size: 14px;">ポイントは、毎月の付与日にまとめて加算させていただきます。</p>
        `;
        gachaModal.classList.add('show');
        return;
    }

    setGachaStatus(
        'NO GOAL',
        'ポイント抽選も今回は落選…',
        result.pointResult === 'closed'
            ? 'ポイント当選枠が上限に達していたため、今回は当選なしです。'
            : 'ユニフォーム賞・ポイント賞ともに今回は落選でした。'
    );
    ball.classList.add('shoot-lose');
    setTimeout(() => { ball.classList.add('shoot-lose-drop'); }, 2000);
    await wait(3000);
    gachaResult.innerHTML = `
        <div class="result-text lose-text">NO GOAL...</div>
        <div class="point-text" style="color: #666;">0 pt</div>
        <p style="color: #666; font-size: 14px;">ユニフォーム賞・ポイント賞ともに今回は落選でした。<br>次回に期待！</p>
    `;
    gachaModal.classList.add('show');
}

async function runUniformDraw() {
    shootBtn.disabled = true;
    shootBtn.innerText = 'ユニフォーム抽選中...';
    setGachaStatus(
        '1st CHALLENGE',
        'ユニフォーム抽選中...',
        'まずはユニフォーム賞の抽選を行っています。'
    );
    resetBallAnimation();
    ball.classList.add('charging');

    try {
        const accessToken = liff.getAccessToken();
        const [apiRes] = await Promise.all([
            post('playUniformGacha', { accessToken }),
            wait(1600)
        ]);

        if (!apiRes || apiRes.ok !== true) {
            alert(getGachaErrorMessage(apiRes?.error));
            closeGachaAndReload();
            return;
        }

        const result = normalizeUniformResult(apiRes);

        if (result.isUniformWin) {
            await showUniformWinResult();
            return;
        }

        // ユニフォーム落選後も外れアニメーションを見せてから、ユーザーの次のタップを待つ。
        await showUniformLoseThenPrepareSecondChance(result.uniformResult);
    } catch (e) {
        console.error('ユニフォーム抽選APIエラー', e);
        alert('通信エラーが発生しました。');
        closeGacha();
    }
}

async function runPointDraw() {
    shootBtn.disabled = true;
    shootBtn.innerText = 'セカンドチャンス抽選中...';
    setGachaStatus(
        'POINT CHANCE',
        '1,000pt抽選中...',
        'セカンドチャンスの結果を判定しています。'
    );
    resetBallAnimation();
    ball.classList.add('charging');

    try {
        const accessToken = liff.getAccessToken();
        const [apiRes] = await Promise.all([
            post('playPointGacha', { accessToken }),
            wait(1400)
        ]);

        if (!apiRes || apiRes.ok !== true) {
            alert(getGachaErrorMessage(apiRes?.error));
            closeGachaAndReload();
            return;
        }

        const result = normalizePointResult(apiRes);
        await showPointFinalResult(result);
    } catch (e) {
        console.error('ポイント抽選APIエラー', e);
        alert('通信エラーが発生しました。');
        closeGacha();
    }
}

shootBtn.addEventListener('click', async () => {
    if (gachaPhase === 'point') {
        await runPointDraw();
        return;
    }
    await runUniformDraw();
});

// 初期化実行
init();
</script>
